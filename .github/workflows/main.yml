name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install Spin
        uses: fermyon/actions/spin/setup@8849a6c41270af8e9f60f371982eddf33b8e35c9

      - name: Build WASM Brain
        run: cd components/brain && cargo build --target wasm32-wasip1 --release

      - name: Build Spin API
        run: cd components/api/api && spin build

      - name: Build CLI
        run: cd components/cli && go build -o useless main.go

      - name: Run Tests
        run: make test

      - name: Upload CLI Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: useless-cli
          path: components/cli/useless

      - name: Upload WASM Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: wasm-modules
          path: |
            components/brain/target/wasm32-wasip1/release/brain.wasm
            components/api/api/target/wasm32-wasip1/release/api.wasm

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android App
        run: |
          cd components/android
          ./gradlew assembleDebug
        env:
          API_URL: "http://10.0.2.2:3000" # Default for CI build

      - name: Upload APK Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: vind-box-android-apk
          path: components/android/app/build/outputs/apk/debug/app-debug.apk

  publish-images:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-operator

      - name: Download WASM Brain
        uses: actions/download-artifact@v4
        with:
          name: wasm-modules
          path: components/

      - name: Build and Push Operator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.operator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          id-token: write # Required for attestations if enabled, but we are disabling

  publish-flux-manifests:
    needs: publish-images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Manifests as OCI Artifact
        run: |
          flux push artifact oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-manifests:${{ github.ref_name }} \
            --path="./deploy" \
            --source="${{ github.event.repository.html_url }}" \
            --revision="${{ github.sha }}"
